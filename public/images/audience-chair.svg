<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29 68 300 150" role="img" aria-label="Dental chair with a $4,200 value tag attached" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="navyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3f61"/><stop offset="1" stop-color="#0d1f3c"/></linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9bb62"/><stop offset="1" stop-color="#b8953a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d1f3c" flood-opacity="0.16"/></filter>
  </defs>
  <rect x="-29.0" y="68.0" width="300.0" height="150.0" fill="#f4f8fc"/>
  <circle cx="250.0" cy="60.5" r="60.0" fill="#e6f0f7"/>
  <circle cx="-17.0" cy="228.5" r="52.5" fill="#fbf5e6"/>
  <!-- ===== Practice owners: dental chair ===== -->
  <g transform="translate(128 146) scale(0.46)">
    <ellipse cx="10" cy="124" rx="150" ry="13" fill="#d7e3ee"/>
    <!-- base + column -->
    <rect x="-62" y="102" width="130" height="18" rx="9" fill="#2b3f61"/>
    <rect x="-12" y="58" width="30" height="48" rx="6" fill="#2b3f61"/>
    <rect x="-12" y="58" width="9" height="48" rx="4" fill="#0d1f3c" opacity="0.35"/>
    <!-- leg rest -->
    <g transform="translate(62 40) rotate(24)"><rect x="-8" y="-15" width="86" height="30" rx="15" fill="url(#navyg)"/><rect x="62" y="-11" width="24" height="22" rx="8" fill="#2b3f61"/></g>
    <!-- seat -->
    <rect x="-72" y="22" width="146" height="44" rx="22" fill="url(#navyg)"/>
    <path d="M-52 32 H50" stroke="#fff" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- backrest -->
    <g transform="translate(-60 44) rotate(-62)">
      <rect x="-24" y="-130" width="48" height="140" rx="24" fill="url(#navyg)"/>
      <rect x="-3.5" y="-112" width="7" height="104" rx="3.5" fill="url(#goldg)"/>
      <rect x="-19" y="-160" width="38" height="36" rx="14" fill="#2b3f61"/>
      <rect x="-19" y="-160" width="10" height="36" rx="5" fill="#fff" opacity="0.12"/>
    </g>
    <!-- armrest -->
    <rect x="-34" y="4" width="78" height="14" rx="7" fill="url(#goldg)"/>
    <!-- light arm -->
    <path d="M146 112 V-98 Q146 -128 112 -128 H30" fill="none" stroke="#2b3f61" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="-148" width="68" height="30" rx="15" fill="url(#navyg)"/>
    <rect x="-12" y="-140" width="48" height="8" rx="4" fill="#f6edc9"/>
    <!-- delivery unit -->
    <rect x="112" y="12" width="64" height="16" rx="8" fill="#2b3f61"/>
    <rect x="146" y="28" width="10" height="84" rx="5" fill="#2b3f61"/>
    <path d="M110 28 C106 62 118 78 112 106 M126 28 C124 58 134 74 130 104 M142 28 C142 54 150 70 146 98" fill="none" stroke="#0d1f3c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="110" cy="107" r="5" fill="#c9a84c"/><circle cx="130" cy="105" r="5" fill="#c9a84c"/>
    <!-- value tag -->
    <path d="M14 -4 C16 6 20 14 22 22" fill="none" stroke="#c9a84c" stroke-width="3" stroke-dasharray="4 4"/>
    <g transform="translate(-8 -66) rotate(-6)" filter="url(#sh)">
      <path d="M0 10 Q0 0 10 0 H88 Q98 0 98 10 V44 Q98 54 88 54 H10 Q0 54 0 44 Z" fill="url(#goldg)"/>
      <circle cx="14" cy="27" r="5" fill="#fbf5e6"/>
      <text x="58" y="36" font-size="25" font-weight="700" fill="#0d1f3c" text-anchor="middle">$4,200</text>
    </g>
  </g>

</svg>
