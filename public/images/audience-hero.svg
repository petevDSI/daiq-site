<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Four audiences who sign off on equipment</title>
  <desc id="d">Practice owners, DSOs, CPAs, and M&amp;A advisors, shown with a dental chair, a portfolio dashboard, a depreciation schedule, and a valuation report. All figures are sample data.</desc>
  <defs>
    <linearGradient id="navyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3f61"/><stop offset="1" stop-color="#0d1f3c"/></linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9bb62"/><stop offset="1" stop-color="#b8953a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d1f3c" flood-opacity="0.16"/></filter>
  </defs>

  <!-- tiles -->
  <rect x="10" y="10" width="225" height="205" rx="20" fill="#fff" stroke="#e4e9ef"/>
  <rect x="10" y="10" width="225" height="205" rx="20" fill="#e6f0f7" opacity="0.45"/>
  <rect x="245" y="10" width="225" height="205" rx="20" fill="#fff" stroke="#e4e9ef"/>
  <rect x="10" y="225" width="225" height="205" rx="20" fill="#fff" stroke="#e4e9ef"/>
  <rect x="245" y="225" width="225" height="205" rx="20" fill="#fbf5e6" stroke="#eadfbf"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#0d1f3c">
    <text x="30" y="42">Practice owners</text>
    <text x="265" y="42">DSOs</text>
    <text x="30" y="257">CPAs</text>
    <text x="265" y="257">M&amp;A advisors</text>
  </g>

  <!-- ===== Practice owners: dental chair ===== -->
  <g transform="translate(128 146) scale(0.46)">
    <ellipse cx="10" cy="124" rx="150" ry="13" fill="#d7e3ee"/>
    <!-- base + column -->
    <rect x="-62" y="102" width="130" height="18" rx="9" fill="#2b3f61"/>
    <rect x="-12" y="58" width="30" height="48" rx="6" fill="#2b3f61"/>
    <rect x="-12" y="58" width="9" height="48" rx="4" fill="#0d1f3c" opacity="0.35"/>
    <!-- leg rest -->
    <g transform="translate(62 40) rotate(24)"><rect x="-8" y="-15" width="86" height="30" rx="15" fill="url(#navyg)"/><rect x="62" y="-11" width="24" height="22" rx="8" fill="#2b3f61"/></g>
    <!-- seat -->
    <rect x="-72" y="22" width="146" height="44" rx="22" fill="url(#navyg)"/>
    <path d="M-52 32 H50" stroke="#fff" stroke-opacity="0.16" stroke-width="4" stroke-linecap="round"/>
    <!-- backrest -->
    <g transform="translate(-60 44) rotate(-62)">
      <rect x="-24" y="-130" width="48" height="140" rx="24" fill="url(#navyg)"/>
      <rect x="-3.5" y="-112" width="7" height="104" rx="3.5" fill="url(#goldg)"/>
      <rect x="-19" y="-160" width="38" height="36" rx="14" fill="#2b3f61"/>
      <rect x="-19" y="-160" width="10" height="36" rx="5" fill="#fff" opacity="0.12"/>
    </g>
    <!-- armrest -->
    <rect x="-34" y="4" width="78" height="14" rx="7" fill="url(#goldg)"/>
    <!-- light arm -->
    <path d="M146 112 V-98 Q146 -128 112 -128 H30" fill="none" stroke="#2b3f61" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-22" y="-148" width="68" height="30" rx="15" fill="url(#navyg)"/>
    <rect x="-12" y="-140" width="48" height="8" rx="4" fill="#f6edc9"/>
    <!-- delivery unit -->
    <rect x="112" y="12" width="64" height="16" rx="8" fill="#2b3f61"/>
    <rect x="146" y="28" width="10" height="84" rx="5" fill="#2b3f61"/>
    <path d="M110 28 C106 62 118 78 112 106 M126 28 C124 58 134 74 130 104 M142 28 C142 54 150 70 146 98" fill="none" stroke="#0d1f3c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="110" cy="107" r="5" fill="#c9a84c"/><circle cx="130" cy="105" r="5" fill="#c9a84c"/>
    <!-- value tag -->
    <path d="M14 -4 C16 6 20 14 22 22" fill="none" stroke="#c9a84c" stroke-width="3" stroke-dasharray="4 4"/>
    <g transform="translate(-8 -66) rotate(-6)" filter="url(#sh)">
      <path d="M0 10 Q0 0 10 0 H88 Q98 0 98 10 V44 Q98 54 88 54 H10 Q0 54 0 44 Z" fill="url(#goldg)"/>
      <circle cx="14" cy="27" r="5" fill="#fbf5e6"/>
      <text x="58" y="36" font-size="25" font-weight="700" fill="#0d1f3c" text-anchor="middle">$4,200</text>
    </g>
  </g>

  <!-- ===== DSOs: portfolio dashboard ===== -->
  <g filter="url(#sh)">
    <rect x="262" y="58" width="192" height="146" rx="12" fill="#fff" stroke="#0d1f3c" stroke-width="2"/>
    <path d="M262 70 a12 12 0 0 1 12 -12 H442 a12 12 0 0 1 12 12 V80 H262 Z" fill="#0d1f3c"/>
    <circle cx="276" cy="69" r="2.6" fill="#c9a84c"/><circle cx="285" cy="69" r="2.6" fill="#fff" opacity="0.6"/><circle cx="294" cy="69" r="2.6" fill="#fff" opacity="0.6"/>
    <text x="304" y="73" font-size="10.5" font-weight="700" fill="#fff">Portfolio</text>
    <text x="446" y="73" font-size="9" fill="#c9a84c" text-anchor="end" font-weight="700">3 locations</text>
  </g>
  <g font-size="10" font-weight="700" fill="#2b3f61">
    <g transform="translate(274 90)"><rect width="76" height="26" rx="7" fill="#f4f8fc" stroke="#e4e9ef"/><rect x="6" y="6" width="14" height="14" rx="3" fill="#0d1f3c"/><rect x="10" y="12" width="6" height="8" fill="#c9a84c"/><text x="26" y="17">Clinic A</text></g>
    <g transform="translate(274 122)"><rect width="76" height="26" rx="7" fill="#f4f8fc" stroke="#e4e9ef"/><rect x="6" y="6" width="14" height="14" rx="3" fill="#0d1f3c"/><rect x="10" y="12" width="6" height="8" fill="#c9a84c"/><text x="26" y="17">Clinic B</text></g>
    <g transform="translate(274 154)"><rect width="76" height="26" rx="7" fill="#f4f8fc" stroke="#e4e9ef"/><rect x="6" y="6" width="14" height="14" rx="3" fill="#0d1f3c"/><rect x="10" y="12" width="6" height="8" fill="#c9a84c"/><text x="26" y="17">Clinic C</text></g>
  </g>
  <path d="M350 103 H362 Q368 103 368 109 V129 M350 135 H368 M350 167 H362 Q368 167 368 161 V141 M368 135 H376" fill="none" stroke="#c9a84c" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="368" cy="135" r="3.6" fill="#c9a84c"/>
  <g>
    <rect x="376" y="90" width="68" height="102" rx="10" fill="url(#navyg)"/>
    <text x="410" y="106" font-size="9" font-weight="700" fill="#fff" opacity="0.8" text-anchor="middle" letter-spacing="0.6">TOTAL FMV</text>
    <text x="410" y="127" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#c9a84c" text-anchor="middle">$2.8M</text>
    <rect x="386" y="164" width="10" height="16" rx="2" fill="#e6f0f7"/><rect x="402" y="152" width="10" height="28" rx="2" fill="#c9a84c"/><rect x="418" y="140" width="10" height="40" rx="2" fill="#e6f0f7"/>
    <path d="M384 184 H438" stroke="#fff" stroke-opacity="0.3"/>
  </g>

  <g transform="translate(0 205)">
  <!-- ===== CPAs: depreciation schedule ===== -->
  <g filter="url(#sh)">
    <rect x="24" y="64" width="152" height="146" rx="10" fill="#fff" stroke="#0d1f3c" stroke-width="2"/>
  </g>
  <rect x="24" y="64" width="152" height="26" rx="10" fill="#f4f8fc"/>
  <rect x="25" y="80" width="150" height="10" fill="#f4f8fc"/>
  <text x="36" y="82" font-size="11.5" font-weight="700" fill="#0d1f3c">Depreciation</text>
  <rect x="36" y="92" width="128" height="3" rx="1.5" fill="#c9a84c"/>
  <g font-size="8.5" font-weight="700" fill="#5d6877" letter-spacing="0.4">
    <text x="40" y="110">YR</text><text x="112" y="110" text-anchor="end">DEPREC.</text><text x="154" y="110" text-anchor="end">BOOK</text>
  </g>
  <g font-size="10.5" fill="#26303f">
    <g><text x="42" y="126">1</text><text x="112" y="126" text-anchor="end">10,000</text><text x="154" y="126" text-anchor="end">40,000</text></g>
    <g><text x="42" y="142">2</text><text x="112" y="142" text-anchor="end">10,000</text><text x="154" y="142" text-anchor="end">30,000</text></g>
    <g><text x="42" y="158">3</text><text x="112" y="158" text-anchor="end">10,000</text><text x="154" y="158" text-anchor="end">20,000</text></g>
    <g><text x="42" y="174">4</text><text x="112" y="174" text-anchor="end">10,000</text><text x="154" y="174" text-anchor="end">10,000</text></g>
    <rect x="32" y="180" width="136" height="18" rx="4" fill="#fbf5e6"/>
    <g font-weight="700"><text x="42" y="193">5</text><text x="112" y="193" text-anchor="end">10,000</text><text x="154" y="193" text-anchor="end">0</text></g>
  </g>
  <g stroke="#e4e9ef"><path d="M32 131 H168 M32 147 H168 M32 163 H168 M32 179 H168"/></g>
  <g filter="url(#sh)">
    <rect x="160" y="112" width="64" height="104" rx="12" fill="#a0522d"/>
    <rect x="160" y="112" width="64" height="104" rx="12" fill="#fff" opacity="0.05"/>
    <rect x="167" y="121" width="50" height="22" rx="5" fill="#fbf5e6"/>
    <text x="212" y="137" font-size="12" font-weight="700" fill="#0d1f3c" text-anchor="end">50,000</text>
    <g fill="#fff"><circle cx="176" cy="158" r="5.5"/><circle cx="194" cy="158" r="5.5"/><circle cx="176" cy="175" r="5.5"/><circle cx="194" cy="175" r="5.5"/><circle cx="176" cy="192" r="5.5"/><circle cx="194" cy="192" r="5.5"/></g>
    <rect x="204" y="152" width="14" height="12" rx="4" fill="#c9a84c"/><rect x="204" y="169" width="14" height="12" rx="4" fill="#c9a84c"/><rect x="204" y="186" width="14" height="12" rx="4" fill="#c9a84c"/>
  </g>

  </g>

  <g transform="translate(6 8)">
  <!-- ===== M&A advisors: CVR report ===== -->
  <g filter="url(#sh)">
    <rect x="320" y="272" width="116" height="144" rx="8" fill="#fff" stroke="#c9d1dc"/>
    <rect x="300" y="264" width="122" height="148" rx="8" fill="#fff" stroke="#0d1f3c" stroke-width="2"/>
  </g>
  <rect x="292" y="264" width="20" height="148" rx="8" fill="url(#navyg)"/>
  <g fill="#c9a84c"><rect x="288" y="276" width="12" height="4" rx="2"/><rect x="288" y="296" width="12" height="4" rx="2"/><rect x="288" y="316" width="12" height="4" rx="2"/><rect x="288" y="336" width="12" height="4" rx="2"/><rect x="288" y="356" width="12" height="4" rx="2"/><rect x="288" y="376" width="12" height="4" rx="2"/></g>
  <text x="322" y="284" font-size="8.5" font-weight="700" fill="#a8872f" letter-spacing="1.2">VALUATION</text>
  <text x="322" y="303" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0d1f3c">CVR report</text>
  <rect x="322" y="310" width="84" height="3" rx="1.5" fill="#c9a84c"/>
  <g><rect x="326" y="354" width="16" height="22" rx="2" fill="#2b3f61"/><rect x="350" y="340" width="16" height="36" rx="2" fill="#a0522d"/><rect x="374" y="324" width="16" height="52" rx="2" fill="#c9a84c"/><path d="M322 377 H402" stroke="#c9d1dc" stroke-width="1.5"/></g>
  <path d="M324 396 q8 -14 14 -4 t12 -2 t14 4 t12 -4" fill="none" stroke="#2b3f61" stroke-width="1.8" stroke-linecap="round"/>
  <g filter="url(#sh)"><circle cx="420" cy="398" r="17" fill="url(#goldg)" stroke="#fbf5e6" stroke-width="3"/></g>
  <path d="M412 398 l6 6 l11 -12" fill="none" stroke="#0d1f3c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- center mark -->
  <circle cx="240" cy="220" r="25" fill="#fffdf8"/>
  <circle cx="240" cy="220" r="19" fill="url(#navyg)"/>
  <text x="240" y="228" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#c9a84c" text-anchor="middle">$</text>
</svg>
